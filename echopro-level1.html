<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoPro — Level 1 Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --circle-size: 72px;
    --cyan: #00d4ff;
    --architect: #22D3EE;
    --gold: #f5c842;
    --purple: #b066ff;
    --bg: #060a14;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: #e0eaff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 14px 20px 12px;
    border-bottom: 1px solid rgba(0,212,255,0.1);
  }
  .topbar-player-tag {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .topbar-player-label {
    font-family: 'Orbitron', monospace;
    font-size: 7px;
    letter-spacing: 2px;
    color: rgba(0,212,255,0.6);
  }
  .topbar-player-name {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    white-space: nowrap;
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 4px;
    padding: 2px 7px;
    background: rgba(0,212,255,0.07);
  }
  .topbar-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
    animation: pulse-live 1.5s ease infinite;
    margin-right: 5px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }
  .back-btn {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 1.5px solid var(--cyan);
    border-radius: 10px;
    background: rgba(0,212,255,0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--cyan); font-size: 22px; text-decoration: none; line-height: 1;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(0,212,255,0.22); }
  .level-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px; font-weight: 700; color: #fff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
  }
  .nav-logo {
    font-family: 'Orbitron', monospace;
    font-size: 11px; font-weight: 600; color: var(--cyan);
    letter-spacing: 1px; text-align: right; line-height: 1.4;
  }

  .section-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px; letter-spacing: 3px;
    color: rgba(0,212,255,0.85);
    text-align: center; padding: 14px 20px 6px;
  }

  /* ── CARD LIST ── */
  .agents-list {
    padding: 8px 14px 24px;
    display: flex; flex-direction: column; gap: 11px;
  }

  /* ── CARD SHELL ── */
  .agent-card {
    position: relative;
    border-radius: 14px;
    /* fixed height so nothing can squish the circles */
    min-height: 100px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease;
    color: inherit; text-decoration: none;
  }
  .agent-card:active { transform: scale(0.98); }

  /* SVG-art gradient backgrounds — layered stops, per tier */
  .tier-expert {
    border: 1.5px solid var(--cyan);
    background:
      radial-gradient(ellipse 120% 80% at 0% 50%,  rgba(0,90,160,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 100% 120% at 100% 100%, rgba(0,180,255,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 80%  80% at 50% 0%,   rgba(0,40,100,0.4)  0%, transparent 70%),
      linear-gradient(160deg, #010e22 0%, #021630 40%, #03203e 100%);
  }
  .tier-agent {
    border: 1.5px solid var(--gold);
    background:
      radial-gradient(ellipse 120% 80% at 0% 50%,  rgba(120,70,0,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 100% 120% at 100% 100%, rgba(245,180,0,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 80%  80% at 50% 0%,   rgba(80,40,0,0.4)  0%, transparent 70%),
      linear-gradient(160deg, #100900 0%, #1e1000 40%, #2c1800 100%);
  }
  .tier-vip {
    border: 1.5px solid var(--purple);
    background:
      radial-gradient(ellipse 120% 80% at 0% 50%,  rgba(80,0,140,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 100% 120% at 100% 100%, rgba(200,100,255,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 80%  80% at 50% 0%,   rgba(50,0,90,0.4)  0%, transparent 70%),
      linear-gradient(160deg, #0c0118 0%, #150228 40%, #1e0438 100%);
  }

  /* HUD corner brackets */
  .agent-card::before, .agent-card::after {
    content: ''; position: absolute; width: 11px; height: 11px;
  }
  .agent-card::before { top: 5px; left: 5px; border-top: 2px solid; border-left: 2px solid; border-radius: 2px 0 0 0; }
  .agent-card::after  { bottom: 5px; right: 5px; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 2px 0; }
  .tier-expert::before, .tier-expert::after { border-color: var(--cyan); }
  .tier-agent::before,  .tier-agent::after  { border-color: var(--gold); }
  .tier-vip::before,   .tier-vip::after    { border-color: var(--purple); }

  /* ── CIRCLE BASE — shared by avatar-wrap AND tier-badge ── */
  /* Both are fixed square containers that never shrink */
  .circle-fixed {
    flex-shrink: 0;
    width:  var(--circle-size);
    height: var(--circle-size);
    min-width:  var(--circle-size);
    min-height: var(--circle-size);
    border-radius: 50%;
    position: relative;
  }

  /* ── AVATAR ── */
  .avatar-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #0d1525;
    border: 2px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 18px; font-weight: 700;
  }
  .tier-expert .avatar-inner { color: var(--cyan); }
  .tier-agent  .avatar-inner { color: var(--gold); }
  .tier-vip   .avatar-inner { color: var(--purple); }

  /* Spinning outer ring (sits outside the circle via negative inset) */
  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid transparent;
    animation: spin-ring 8s linear infinite;
  }
  .tier-expert .avatar-ring { border-top-color: var(--cyan);   border-right-color: rgba(0,212,255,0.25); }
  .tier-agent  .avatar-ring { border-top-color: var(--gold);   border-right-color: rgba(245,200,66,0.25); }
  .tier-vip   .avatar-ring { border-top-color: var(--purple); border-right-color: rgba(176,102,255,0.25); }
  @keyframes spin-ring { to { transform: rotate(360deg); } }

  /* Orbital dots on avatar ring */
  .dot {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    top: 50%; left: 50%;
  }
  .dot-1 { animation: orb1 8s linear infinite; }
  .dot-2 { animation: orb2 8s linear infinite; }
  .dot-3 { animation: orb3 8s linear infinite; }
  /* radius = half(circle-size) + ring-inset = 36+5 = 41px */
  @keyframes orb1 { from{transform:translate(-50%,-50%) rotate(0deg)   translateY(-41px)} to{transform:translate(-50%,-50%) rotate(360deg)   translateY(-41px)} }
  @keyframes orb2 { from{transform:translate(-50%,-50%) rotate(120deg) translateY(-41px)} to{transform:translate(-50%,-50%) rotate(480deg) translateY(-41px)} }
  @keyframes orb3 { from{transform:translate(-50%,-50%) rotate(240deg) translateY(-41px)} to{transform:translate(-50%,-50%) rotate(600deg) translateY(-41px)} }
  .tier-expert .dot { background: var(--cyan);   box-shadow: 0 0 5px var(--cyan); }
  .tier-agent  .dot { background: var(--gold);   box-shadow: 0 0 5px var(--gold); }
  .tier-vip   .dot { background: var(--purple); box-shadow: 0 0 5px var(--purple); }

  /* ── TIER BADGE CIRCLE ── */
  .tier-badge {
    border: 2px solid;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
    text-align: center;
  }
  .tier-expert .tier-badge {
    color: var(--cyan);
    border-color: rgba(0,212,255,0.45);
    background: radial-gradient(circle, rgba(0,212,255,0.10) 0%, transparent 70%);
    box-shadow: 0 0 12px rgba(0,212,255,0.15) inset;
  }
  .tier-agent .tier-badge {
    color: var(--gold);
    border-color: rgba(245,200,66,0.45);
    background: radial-gradient(circle, rgba(245,200,66,0.10) 0%, transparent 70%);
    box-shadow: 0 0 12px rgba(245,200,66,0.15) inset;
  }
  .tier-vip .tier-badge {
    color: var(--purple);
    border-color: rgba(176,102,255,0.45);
    background: radial-gradient(circle, rgba(176,102,255,0.10) 0%, transparent 70%);
    box-shadow: 0 0 12px rgba(176,102,255,0.15) inset;
  }

  /* Cardinal dots on tier badge */
  .bdot {
    position: absolute;
    width: 4px; height: 4px; border-radius: 50%;
    top: 50%; left: 50%;
    z-index: 2;
  }
  .tier-expert .bdot { background: var(--cyan); }
  .tier-agent  .bdot { background: var(--gold); }
  .tier-vip   .bdot { background: var(--purple); }
  /* radius = half(72px) = 36px, same as circle edge */
  .bdot:nth-child(1) { transform: translate(-50%,-50%) rotate(0deg)   translateX(36px); }
  .bdot:nth-child(2) { transform: translate(-50%,-50%) rotate(90deg)  translateX(36px); }
  .bdot:nth-child(3) { transform: translate(-50%,-50%) rotate(180deg) translateX(36px); }
  .bdot:nth-child(4) { transform: translate(-50%,-50%) rotate(270deg) translateX(36px); }
  /* photo-badge: img is child 1, so bdots are children 2-5 */
  .photo-badge .bdot:nth-child(2) { transform: translate(-50%,-50%) rotate(0deg)   translateX(36px); }
  .photo-badge .bdot:nth-child(3) { transform: translate(-50%,-50%) rotate(90deg)  translateX(36px); }
  .photo-badge .bdot:nth-child(4) { transform: translate(-50%,-50%) rotate(180deg) translateX(36px); }
  .photo-badge .bdot:nth-child(5) { transform: translate(-50%,-50%) rotate(270deg) translateX(36px); }
  .badge-label { position: relative; z-index: 1; }

  /* ── CARD BODY (middle flex column) ── */
  .card-body {
    flex: 1 1 0;
    min-width: 0;
    display: flex; flex-direction: column; gap: 9px;
  }
  .agent-name {
    font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 700; color: #fff;
    letter-spacing: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tick-row {
    display: flex; align-items: center; gap: 7px;
  }
  .tick { font-size: 10px; letter-spacing: 2px; opacity: 0.38; color: #fff; }
  .view-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.4px;
    text-decoration: none; cursor: pointer;
    transition: filter 0.2s;
    white-space: nowrap;
  }
  .tier-expert .view-btn { background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.4); color: #90e4ff; }
  .tier-agent  .view-btn { background: rgba(245,200,66,0.07); border: 1px solid rgba(245,200,66,0.4); color: #ffe070; }
  .tier-vip   .view-btn { background: rgba(176,102,255,0.07); border: 1px solid rgba(176,102,255,0.4); color: #cfa0ff; }
  .view-btn:hover { filter: brightness(1.3); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    border-top: 1px solid rgba(0,212,255,0.1);
    padding: 14px 20px;
    display: flex; justify-content: space-around;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; color: rgba(0,212,255,0.4);
    letter-spacing: 0.8px; font-weight: 500;
    text-decoration: none; transition: color 0.2s;
  }
  .nav-item.active, .nav-item:hover { color: var(--cyan); }
  .nav-icon { font-size: 20px; line-height: 1; display: block; width: 22px; height: 22px; }

  /* ── HUD PAGE CORNERS ── */
  .hud-corner { position: fixed; width: 26px; height: 26px; pointer-events: none; z-index: 999; }
  .hud-tl { top:8px; left:8px;  border-top:1.5px solid rgba(0,212,255,0.3); border-left:1.5px solid rgba(0,212,255,0.3); }
  .hud-tr { top:8px; right:8px; border-top:1.5px solid rgba(0,212,255,0.3); border-right:1.5px solid rgba(0,212,255,0.3); }
  .hud-bl { bottom:8px; left:8px;  border-bottom:1.5px solid rgba(0,212,255,0.3); border-left:1.5px solid rgba(0,212,255,0.3); }
  .hud-br { bottom:8px; right:8px; border-bottom:1.5px solid rgba(0,212,255,0.3); border-right:1.5px solid rgba(0,212,255,0.3); }

  .photo-badge {
    border: 2px solid var(--cyan);
    overflow: visible !important;
    padding: 0;
    background: none;
    box-shadow: 0 0 14px rgba(0,212,255,0.25);
  }
  .photo-badge img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    display: block;
    z-index: 0;
    clip-path: circle(50% at 50% 50%);
  }
  .tier-expert .photo-badge { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,212,255,0.25); }

  .tier-architect {
    border: 1.5px solid var(--architect);
    background:
      radial-gradient(ellipse 120% 80% at 0% 50%,  rgba(6,120,160,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 100% 120% at 100% 100%, rgba(34,211,238,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 80%  80% at 50% 0%,   rgba(0,60,90,0.4)  0%, transparent 70%),
      linear-gradient(160deg, #00080D 0%, #000C12 40%, #001520 100%);
  }
  .tier-architect::before, .tier-architect::after { border-color: var(--architect); }
  .tier-architect .avatar-inner { color: var(--architect); }
  .tier-architect .avatar-ring { border-top-color: var(--architect); border-right-color: rgba(34,211,238,0.25); }
  .tier-architect .dot { background: var(--architect); box-shadow: 0 0 5px var(--architect); }
  .tier-architect .tier-badge {
    color: var(--architect);
    border-color: rgba(34,211,238,0.45);
    background: radial-gradient(circle, rgba(34,211,238,0.10) 0%, transparent 70%);
    box-shadow: 0 0 12px rgba(34,211,238,0.15) inset;
  }
  .tier-architect .bdot { background: var(--architect); }
  .tier-architect .view-btn { background: rgba(34,211,238,0.07); border: 1px solid rgba(34,211,238,0.4); color: #80eeff; }
  .tier-architect .photo-badge { border-color: var(--architect); box-shadow: 0 0 14px rgba(34,211,238,0.25); }

</style></style>
</head>
<body>

<div class="hud-corner hud-tl"></div>
<div class="hud-corner hud-tr"></div>
<div class="hud-corner hud-bl"></div>
<div class="hud-corner hud-br"></div>

<div class="page">
  <nav class="topbar">
    <a class="back-btn" href="echopro-share.html" aria-label="Back">&#8249;</a>
    <span class="level-title">LEVEL 1</span>
    <div class="topbar-player-tag">
      <span class="topbar-player-label">PLAYER</span>
      <div class="topbar-player-name">
        <span class="topbar-dot"></span>SARAHJONES
      </div>
    </div>
  </nav>

  <p class="section-label">&#9656; ACTIVE PLAYERS &#9656;</p>

  <div style="display:flex;align-items:center;gap:10px;padding:0 16px 10px;">
    <div style="flex:1;height:4px;background:rgba(0,212,255,0.15);border-radius:2px;overflow:hidden;">
      <div style="width:100%;height:100%;background:linear-gradient(90deg,rgba(0,212,255,0.4),var(--cyan));border-radius:2px;"></div>
    </div>
    <span style="font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--cyan);letter-spacing:1px;white-space:nowrap;flex-shrink:0;">5/5</span>
  </div>

  <main class="agents-list">

    
    <div class="agent-card tier-expert">
      <div class="circle-fixed tier-badge photo-badge">
        <img src="images/image-4.jpg" alt="Profile" style="width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;display:block;">
        <div class="bdot"></div><div class="bdot"></div>
        <div class="bdot"></div><div class="bdot"></div>
      </div>
      <div class="card-body">
        <span class="agent-name">MIQOSHI</span>
        <div class="tick-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="view-btn" href="echopro-level3.html">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>
      <div class="circle-fixed">
        <div class="avatar-ring"></div>
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
        <div class="avatar-inner" style="font-size:9px;letter-spacing:0.5px;">Specialist</div>
      </div>
    </div>

    
    <div class="agent-card tier-expert">
      <div class="circle-fixed tier-badge photo-badge">
        <img src="images/image-5.jpg" alt="Profile" style="width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;display:block;">
        <div class="bdot"></div><div class="bdot"></div>
        <div class="bdot"></div><div class="bdot"></div>
      </div>
      <div class="card-body">
        <span class="agent-name">RADAR</span>
        <div class="tick-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="view-btn" href="#">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>
      <div class="circle-fixed">
        <div class="avatar-ring"></div>
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
        <div class="avatar-inner" style="font-size:9px;letter-spacing:0.5px;">Specialist</div>
      </div>
    </div>

    
    <div class="agent-card tier-expert">
      <div class="circle-fixed tier-badge photo-badge">
        <img src="images/image-6.jpg" alt="Profile" style="width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;display:block;">
        <div class="bdot"></div><div class="bdot"></div>
        <div class="bdot"></div><div class="bdot"></div>
      </div>
      <div class="card-body">
        <span class="agent-name">SHARKDOLL</span>
        <div class="tick-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="view-btn" href="#">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>
      <div class="circle-fixed">
        <div class="avatar-ring"></div>
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
        <div class="avatar-inner" style="font-size:9px;letter-spacing:0.5px;">Specialist</div>
      </div>
    </div>

    
    <div class="agent-card tier-agent">
      <div class="circle-fixed tier-badge photo-badge">
        <img src="images/image-7.jpg" alt="Swansong" style="width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:50%;display:block;">
        <div class="bdot"></div><div class="bdot"></div>
        <div class="bdot"></div><div class="bdot"></div>
      </div>
      <div class="card-body">
        <span class="agent-name">SWANSONG</span>
        <div class="tick-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="view-btn" href="#">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>
      <div class="circle-fixed">
        <div class="avatar-ring"></div>
        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
        <div class="avatar-inner" style="font-size:10px;letter-spacing:0.5px;">Builder</div>
      </div>
    </div>

    
    <div class="agent-card tier-vip">
      <div class="circle-fixed tier-badge photo-badge" style="background-image:url('images/image-8.jpg');background-size:cover;background-position:center 20%;">
        <div class="bdot"></div><div class="bdot"></div>
        <div class="bdot"></div><div class="bdot"></div>
      </div>
      <div class="card-body">
        <span class="agent-name">CASHTHOMPSON</span>
        <div class="tick-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="view-btn" href="#">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>
      <div class="circle-fixed">
        <div class="avatar-ring"></div>
        <div class="dot dot-1"></div>
