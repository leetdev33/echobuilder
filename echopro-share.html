<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoPro — Echo Team</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00d4ff;
    --architect: #22D3EE;
    --gold: #f5c842;
    --purple: #b066ff;
    --bg: #000000;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: #e0eaff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .page { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

  .hud-corner { position: fixed; width: 26px; height: 26px; pointer-events: none; z-index: 999; }
  .hud-tl { top:8px; left:8px;  border-top:1.5px solid rgba(0,212,255,0.3); border-left:1.5px solid rgba(0,212,255,0.3); }
  .hud-tr { top:8px; right:8px; border-top:1.5px solid rgba(0,212,255,0.3); border-right:1.5px solid rgba(0,212,255,0.3); }
  .hud-bl { bottom:8px; left:8px;  border-bottom:1.5px solid rgba(0,212,255,0.3); border-left:1.5px solid rgba(0,212,255,0.3); }
  .hud-br { bottom:8px; right:8px; border-bottom:1.5px solid rgba(0,212,255,0.3); border-right:1.5px solid rgba(0,212,255,0.3); }





  /* TEAM PANEL */
  .team-panel {
    margin: 28px 36px 8px;
    border: 1.5px solid var(--cyan);
    border-radius: 16px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(0,60,120,0.45) 0%, transparent 70%),
      linear-gradient(160deg, #010e22 0%, #021630 60%, #03203e 100%);
    box-shadow: 0 0 24px rgba(0,212,255,0.08);
  }

  /* LEVEL CARDS */
  .levels-list {
    padding: 4px 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .level-card {
    position: relative;
    border-radius: 14px;
    padding: 16px 16px 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease;
    background: linear-gradient(160deg, #060a14 0%, #0a1020 100%);
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .level-card:active { transform: scale(0.98); }
  .level-card::before, .level-card::after {
    content: ''; position: absolute; width: 11px; height: 11px;
    border-color: var(--cyan);
  }
  .level-card::before { top:5px; left:5px; border-top:2px solid; border-left:2px solid; border-radius:2px 0 0 0; }
  .level-card::after  { bottom:5px; right:5px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 2px 0; }

  /* LEVEL BADGE */
  .level-badge {
    font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700;
    color: var(--cyan);
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(0,212,255,0.4);
    display: block;
    margin-bottom: 12px;
  }

  /* PLAYERS ROW — full width centered */
  .level-players-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .level-players-label {
    font-size: 12px;
    color: rgba(224,234,255,0.7);
    letter-spacing: 0.3px;
  }
  .level-players-label span { color: var(--cyan); font-weight: 600; }
  .level-progress {
    height: 4px;
    width: 100%;
    background: rgba(0,212,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .level-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(0,212,255,0.35), var(--cyan));
    border-radius: 2px;
  }

  /* VIEW BTN ROW — centered with tick marks like agents page */
  .view-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .tick {
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.38;
    color: #fff;
  }
  .level-view-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 26px;
    border-radius: 6px;
    border: 1px solid rgba(0,212,255,0.4);
    background: rgba(0,212,255,0.07);
    color: #90e4ff;
    font-size: 13px; font-weight: 500; letter-spacing: 0.4px;
    text-decoration: none; cursor: pointer;
    transition: filter 0.2s;
    white-space: nowrap;
  }
  .level-view-btn:hover { filter: brightness(1.3); }

  /* BOTTOM NAV */
  .bottom-nav {
    border-top: 1px solid rgba(0,212,255,0.1);
    padding: 14px 20px;
    display: flex; justify-content: space-around;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; color: rgba(0,212,255,0.4);
    letter-spacing: 0.8px; font-weight: 500;
    text-decoration: none; transition: color 0.2s; cursor: pointer;
  }
  .nav-item.active, .nav-item:hover { color: var(--cyan); }
  .nav-icon { display: block; width: 22px; height: 22px; }

  @keyframes pulse-live { 0%,100%{opacity:1}50%{opacity:0.3} }

  .back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 9999;
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 1.5px solid var(--cyan);
    border-radius: 10px;
    background: rgba(0,212,255,0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--cyan); font-size: 22px; text-decoration: none; line-height: 1;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(0,212,255,0.22); }
</style>
</head>
<body>
<a class="back-btn" href="index.html" aria-label="Back">&#8249;</a>


<div class="hud-corner hud-tl"></div>
<div class="hud-corner hud-tr"></div>

<div class="page">

    <img src="images/echo-team-logo.png" alt="Echo Team" style="display:block;width:50%;height:auto;margin:20px auto;object-fit:contain;object-position:center;">

    <div class="levels-list">


      <div class="level-card level-card-l1" onclick="window.location.href='echopro-level1.html'">

        </div>
        <div class="view-row">

          <a class="level-view-btn" href="#" onclick="window.location.href='echopro-level1.html'">View</a>

        </div>
      </div>


      <div class="level-card level-card-l2" onclick="window.location.href='echopro-level2.html'">
        <span class="level-badge">LEVEL 2</span>
        <div class="level-players-section">
          <span class="level-players-label">Active Players: <span>25/25</span></span>
          <div class="level-progress">
            <div class="level-progress-fill" style="width:100%;"></div>
          </div>
        </div>
        <div class="view-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="level-view-btn" href="#" onclick="window.location.href='echopro-level2.html'">View</a>
          <span class="tick">&#9016;&#9016;</span>

      </div>


      <div class="level-card level-card-l3">
        <span class="level-badge">LEVEL 3</span>
        <div class="level-players-section">
          <span class="level-players-label">Active Players: <span>18/125</span></span>
          <div class="level-progress">
            <div class="level-progress-fill" style="width:14.4%;"></div>
          </div>
        </div>
        <div class="view-row">
          <span class="tick">&#9016;&#9016;</span>
          <a class="level-view-btn" href="#">View</a>
          <span class="tick">&#9016;&#9016;</span>
        </div>
      </div>

    </div>
  </div>


  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="#">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Share

    <a class="nav-item active" href="#">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <a class="nav-item" href="#">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V9m0 0L4 13m4-4l4 4M16 3v18m0 0l4-4m-4 4l-4-4"/></svg>

    <a class="nav-item" href="#">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

  </nav>

</div>
</body>
</html>
